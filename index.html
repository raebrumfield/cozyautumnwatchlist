<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Autumn Watchlist</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F9F8F7;
    color: #2C2C2B;
    min-height: 100vh;
    padding: 40px 24px 60px;
  }
  header { text-align: center; margin-bottom: 40px; }
  header h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { margin-top: 8px; font-size: 15px; color: #7D7A75; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
  .tab-btn {
    padding: 10px 24px; border-radius: 8px; border: 1.5px solid #E6E5E3;
    background: #fff; font-size: 14px; font-weight: 500; color: #7D7A75;
    cursor: pointer; transition: all 0.15s;
  }
  .tab-btn.active { background: #2783DE; border-color: #2783DE; color: #fff; }
  .tab-btn:hover:not(.active) { border-color: #2783DE; color: #2783DE; }
  .section { display: none; }
  .section.active { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .card {
    background: #fff; border: 1.5px solid #E6E5E3; border-radius: 12px;
    padding: 18px 14px; cursor: pointer;
    transition: box-shadow 0.18s, border-color 0.18s, transform 0.15s;
    display: flex; flex-direction: column; gap: 6px; min-height: 108px;
  }
  .card:hover {
    border-color: #2783DE;
    box-shadow: 0 4px 16px rgba(39,131,222,0.10);
    transform: translateY(-2px);
  }
 /* Pastel color backgrounds for categories */
.movie-card {
  background-color: #FFE5C2; /* pastel orange */
}

.tv-card {
  background-color: #FFF9C4; /* pastel yellow */
}

  .card:focus { outline: 2px solid #2783DE; outline-offset: 2px; }
  .card-emoji { font-size: 1.4rem; line-height: 1; }
  .card-title { font-size: 14px; font-weight: 600; color: #2C2C2B; line-height: 1.3; }
  .card-genre { font-size: 12px; color: #7D7A75; }

  /* Modal */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44,44,43,0.4); z-index: 100;
    align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 460px; width: 100%;
    padding: 32px; position: relative;
    box-shadow: 0 8px 48px rgba(0,0,0,0.16);
    animation: slideUp 0.2s;
  }
  @keyframes slideUp {
    from { transform: translateY(14px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
    border-radius: 8px; border: none; background: #F0EFED; color: #7D7A75;
    font-size: 17px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.15s;
  }
  .modal-close:hover { background: #E6E5E3; }
  .modal-emoji { font-size: 2.2rem; margin-bottom: 10px; }
  .modal-tag {
    display: inline-block; font-size: 12px; font-weight: 500;
    background: #E5F2FC; color: #2783DE; border-radius: 6px;
    padding: 3px 10px; margin-bottom: 10px;
  }
  .modal-title { font-size: 1.25rem; font-weight: 700; color: #2C2C2B; margin-bottom: 4px; line-height: 1.3; }
  .modal-genre { font-size: 13px; color: #7D7A75; margin-bottom: 14px; }
  .modal-summary { font-size: 14px; line-height: 1.65; color: #2C2C2B; margin-bottom: 22px; }
  .modal-footer { display: flex; align-items: center; justify-content: flex-end; }
  .watch-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 8px; background: #2783DE;
    color: #fff; font-size: 14px; font-weight: 500; text-decoration: none;
    transition: background 0.15s;
  }
  .watch-btn:hover { background: #1a6ec2; }
  @media (max-width: 500px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .modal { padding: 24px; }
  }
</style>
</head>
<body>
<header>
  <h1>🍂 Cozy Autumn Watchlist</h1>
  <p>Click any title to see details</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('movies', this)">🎬 Movies (32)</button>
  <button class="tab-btn" onclick="switchTab('tv', this)">📺 TV Shows (26)</button>
</div>

<div class="section active" id="movies"><div class="grid" id="movies-grid"></div></div>
<div class="section" id="tv"><div class="grid" id="tv-grid"></div></div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
    <div class="modal-emoji" id="modal-emoji"></div>
    <div class="modal-tag" id="modal-tag"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-genre" id="modal-genre"></div>
    <div class="modal-summary" id="modal-summary"></div>
    <div class="modal-footer">
      <a class="watch-btn" id="modal-link" href="#" target="_blank" rel="noopener">▶ Find to watch</a>
    </div>
  </div>
</div>

<script>

function renderGrid(items, containerId, type) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = items.map((item, i) => `
   <div class="card ${type === 'movies' ? 'movie-card' : 'tv-card'}" tabindex="0"
      onclick="openModal('${type}', ${i})"
      onkeydown="if(event.key==='Enter')openModal('${type}',${i})">
      <div class="card-emoji">${item.emoji}</div>
      <div class="card-title">${item.title}</div>
      <div class="card-genre">${item.genre}</div>
</div>


renderGrid(movies, 'movies-grid', 'movies');
renderGrid(tvShows, 'tv-grid', 'tv');

function switchTab(tab, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  btn.classList.add('active');
}

function openModal(type, index) {
  const item = type === 'movies' ? movies[index] : tvShows[index];
  document.getElementById('modal-emoji').textContent = item.emoji;
  document.getElementById('modal-tag').textContent = type === 'movies' ? '🎬 Movie' : '📺 TV Show';
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-genre').textContent = item.genre;
  document.getElementById('modal-summary').textContent = item.summary;
  document.getElementById('modal-link').href = item.link;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
